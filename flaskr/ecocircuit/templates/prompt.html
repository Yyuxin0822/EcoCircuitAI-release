{% extends 'base.html' %} {% block scripts %}
<link
  rel="stylesheet"
  href="{{ url_for('ecocircuit.static', filename='icon.css') }}"
/>

<script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
<script>
  const isLocal =
    window.location.hostname === "localhost" ||
    window.location.hostname === "127.0.0.1";
  const baseUrl = isLocal
    ? "http://127.0.0.1:8000"
    : "https://www.ecocircuitai.com";

  // Explicitly added namespace '/ecocircuit' here:
  const socket = io(baseUrl + "/ecocircuit", {
    path: "/socket.io",
    transports: ["websocket", "polling"],
    withCredentials: true,
    autoConnect: false,
  });
  window.socket = socket; // Make socket globally accessible
  document.addEventListener("DOMContentLoaded", function () {
    // document.getElementById("header-bar").style.display = "none";
    socket.connect();
    socket.on("connect", function () {
      console.log("✅ Connected to /ecocircuit.");
    });

    socket.on("private_msg", function (msg) {
      console.log("📩 Private message for me:", msg.data);
    });

    socket.on("disconnect", function () {
      console.log("❌ Disconnected from /ecocircuit.");
    });

    socket.on("connect_error", function (error) {
      console.error("❗ Connection error:", error);
    });
  });
</script>
<link
  rel="stylesheet"
  href="{{ url_for('ecocircuit.static', filename='prompt.css') }}"
/>
<link
  rel="stylesheet"
  href="{{ url_for('ecocircuit.static', filename='utils/SystemBar.css') }}"
/>

<script src="{{ url_for('ecocircuit.static', filename='utils/SystemBar.js') }}"></script>
<script>
  const defaultSystems = {
    WATER: ["#0BF", "{{ url_for('ecocircuit.static', filename='icon/Iconsystem-dark-water.png', _external=True) }}"],
    BIOSYSTEM: ["#3C4", "{{ url_for('ecocircuit.static', filename='icon/Iconsystem-dark-biosystem.png', _external=True) }}"],
    // "FAMILY ACTIVITIES": ["#9DC", "{{ url_for('ecocircuit.static', filename='icon/Iconsystem-dark-family.png', _external=True) }}"],
    // "ECONOMY INITIATIVES": ["#FDA", "{{ url_for('ecocircuit.static', filename='icon/Iconsystem-dark-fund.png', _external=True) }}"],
    "RENEWABLE ENERGY": ["#FC0", "{{ url_for('ecocircuit.static', filename='icon/Iconsystem-dark-energy.png', _external=True) }}"],
    MOBILITY: ["#F44", "{{ url_for('ecocircuit.static', filename='icon/Iconsystem-dark-mobility.png', _external=True) }}"],
    "SOLID WASTE": ["#A75", "{{ url_for('ecocircuit.static', filename='icon/Iconsystem-dark-solidwaste.png', _external=True) }}"],
    // "DIGITAL TWIN": ["#ACB7DE", "{{ url_for('ecocircuit.static', filename='icon/Iconsystem-dark-ict.png', _external=True) }}"]
  };
  let currentSystems = {};
  window.defaultSystems = window.sortSystemsByHue(defaultSystems);
  window.currentSystems = currentSystems;
</script>
<script
  src="{{ url_for('ecocircuit.static', filename='prompt.js') }}"
  defer
></script>

{% endblock %} {% block content %}
<div class="user-page">
  <div class="content-wrapper normal">
    <div class="sub-wrapper" id="left-col">
      <div id="step-1">
        <div class="sketchbook-text instruct">
          <span class="icon-switch" id="icon-switch"> </span>
          <span>1 Type a few words / Drop an Image...</span>
        </div>

        <div class="input-wrapper" id="text-prompt">
          <div style="display: flex; flex-direction: column; align-items: flex-start; width: 1.875rem; flex-shrink: 0;">
            <span class="icon-common icon-description"></span>
            <div class="word-counter" style="font-size: 12px; color: #666; margin-top: 4px;">
              <span id="word-count">0</span> <br>/ 300 words
            </div>
          </div>
          <textarea
            id="description"
            placeholder="Click and describe a project ..."
            class="input-window"
            maxlength="1800"
          ></textarea>
        </div>

        <div class="input-wrapper" id="image-prompt" style="display: none">
          <span class="icon-common icon-image"></span>
          <input
            type="file"
            id="image-upload"
            name="image"
            accept="image/*"
            style="display: none"
          />

          <label for="image-upload" class="input-window" id="image-label">
            <img
              id="preview-img"
              src="#"
              alt="Image preview..."
              style="display: none; max-width: 100%"
            />
            <span>Drag or Browse Image to Upload</span>
          </label>
        </div>
      </div>

      <div id="step-2">
        <div id="system-bar-wrapper">
          <div class="sketchbook-text instruct">2 Pick Systems!</div>
          <div id="system-bar">
            <!-- <div id="system-bar-default" class="system-bar-default"></div> -->
            <!-- <div class="project-system-default hidden" id="project-system-default">
            {"HYDRO": "#0BF", "ENERGY": "#FC0", "SOLID WASTE": "#A75",
            "TELECOMMUNICATION": "#95A", "MOBILITY": "#F44",
            "BIOSYSTEM": "#3C4", "UNKNOWN": "#888"}</div> -->
          </div>
        </div>
      </div>
    </div>

    <div class="sub-wrapper" id="right-col">
      <div id="step-3">
        <div class="instruct">
          <span class="icon-sketcharrow-up"></span>
          <span class="idx sketchbook-text">3</span>
        </div>
        <button type="submit" id="start-thinking">
          <span class="icon-start"></span>
          <span class="sketchbook-text">Start Thinking</span>
        </button>
      </div>
    </div>
  </div>
</div>

{% endblock %}
