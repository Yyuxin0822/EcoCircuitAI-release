<script>
  const isLocal =
    window.location.hostname === "localhost" ||
    window.location.hostname === "127.0.0.1";
  const baseUrl = isLocal
    ? "http://127.0.0.1:8000"
    : "https://www.ecocircuitai.com";

  // Explicitly added namespace '/ecocircuit' here:
  const socket = io(baseUrl + "/ecocircuit", {
    path: "/socket.io",
    transports: ["websocket", "polling"],
    withCredentials: true,
    autoConnect: false,
  });
  window.socket = socket; // Make socket globally accessible
  document.addEventListener("DOMContentLoaded", function () {
    socket.connect();

    socket.on("connect", function () {
      console.log("✅ Connected to /ecocircuit.");
    });

    socket.on("private_msg", function (msg) {
      console.log("📩 Private message for me:", msg.data);
    });

    socket.on("disconnect", function () {
      console.log("❌ Disconnected from /ecocircuit.");
    });

    socket.on("connect_error", function (error) {
      console.error("❗ Connection error:", error);
    });

    window.socket.on("prompt_response", function (msg) {
      if (msg.status === "success") {
        window.location.href = msg.redirect_url;
      } else {
        alert(msg.error);
      }
    });

    // Listen for progress updates
    window.socket.on("progress_update", (data) => {
      console.log(data.message, data.percent + "%");
      updateLoaderText(data.message, data.percent);
    });
  });
</script>

<script>
  // Capture thumbnails after initial visualizations are rendered
  document.addEventListener("DOMContentLoaded", function () {
    console.log("DOM loaded, waiting for visualizations to render...");

    function checkVisualizationsReady() {
      const ioSvg = document.getElementById("matrix-io");
      const metabolismSvg = document.getElementById("matrix-metabolism");

      // Check if both SVGs exist and have content
      const ioReady =
        ioSvg && (ioSvg.children.length > 0 || ioSvg.innerHTML.trim() !== "");
      const metabolismReady =
        metabolismSvg &&
        (metabolismSvg.children.length > 0 ||
          metabolismSvg.innerHTML.trim() !== "");

      if (ioReady && metabolismReady) {
        console.log("Both visualizations are ready, capturing thumbnails...");
        if (window.setupThumbnailCapture) {
          window.setupThumbnailCapture();
        } else {
          console.warn("setupThumbnailCapture function not available");
        }
        return true;
      }
      return false;
    }

    // Try immediately
    if (checkVisualizationsReady()) {
      return;
    }

    // If not ready, use MutationObserver to watch for changes
    const observer = new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        if (mutation.type === "childList" && mutation.addedNodes.length > 0) {
          if (checkVisualizationsReady()) {
            observer.disconnect();
          }
        }
      });
    });

    // Observe both SVGs for changes
    const ioSvg = document.getElementById("matrix-io");
    const metabolismSvg = document.getElementById("matrix-metabolism");

    if (ioSvg) {
      observer.observe(ioSvg, { childList: true, subtree: true });
    }
    if (metabolismSvg) {
      observer.observe(metabolismSvg, { childList: true, subtree: true });
    }

    // Fallback timeout in case MutationObserver doesn't catch it
    setTimeout(function () {
      if (checkVisualizationsReady()) {
        observer.disconnect();
      } else {
        console.warn(
          "Visualizations not ready after 10 seconds, attempting thumbnail capture anyway..."
        );
        if (window.setupThumbnailCapture) {
          window.setupThumbnailCapture();
        }
        observer.disconnect();
      }
    }, 10000);
  });
</script>
